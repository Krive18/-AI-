<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050b18" />
    <meta name="linguasphere-api-base-url" content="" />
    <meta name="linguasphere-login-success-path" content="/" />
    <meta name="description" content="寰语智能视频全球化工作台登录页" />
    <title>寰语｜LinguaSphere 智能视频全球化工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <span class="brand" aria-label="寰语">
          <svg viewBox="0 0 52 52" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="logo-gradient" x1="7" y1="4" x2="46" y2="49" gradientUnits="userSpaceOnUse">
                <stop stop-color="#29b8ff" />
                <stop offset=".52" stop-color="#427bff" />
                <stop offset="1" stop-color="#9554ff" />
              </linearGradient>
            </defs>
            <path d="M12 5.75h28A6.25 6.25 0 0 1 46.25 12v21A6.25 6.25 0 0 1 40 39.25H29.4L20 47.2v-7.95h-8A6.25 6.25 0 0 1 5.75 33V12A6.25 6.25 0 0 1 12 5.75Z" stroke="url(#logo-gradient)" stroke-width="4.2" stroke-linejoin="round" />
            <path d="M18.2 16.2h15.6M26 13v3.2m-6.2 0c1.15 5.55 4.9 9.75 11.25 12.55m.25-12.55c-1.2 5.3-4.8 9.35-10.9 12.2" stroke="#9bd2ff" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          <strong><span>寰语</span></strong>
        </span>
      </header>

      <div class="layout">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <h1 id="hero-title">开启<span>智能</span>翻译工作流</h1>
            <p>面向全球化团队的智能视频全球化工作台，统一管理转写、翻译、字幕与配音，让每一次交付更高效。</p>
            <ul class="capabilities" aria-label="平台能力">
              <li>
                <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M3 14v3m4-9v12m4-16v20m4-15v10m4-14v18m4-12v6m2-4v2" stroke="#408fff" stroke-width="2.4" stroke-linecap="round" /></svg>
                智能转写
              </li>
              <li>
                <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="4" y="4" width="20" height="20" rx="5" stroke="#408fff" stroke-width="2" /><path d="M9 9h10M14 9v10m-4 0h8" stroke="#408fff" stroke-width="2" stroke-linecap="round" /></svg>
                术语一致
              </li>
              <li>
                <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 3.5 23 7v6.3c0 5.4-3.65 9.15-9 11.2-5.35-2.05-9-5.8-9-11.2V7l9-3.5Z" stroke="#408fff" stroke-width="2" /><path d="m10 14 2.5 2.5L18.5 11" stroke="#408fff" stroke-width="2.2" stroke-linecap="round" /></svg>
                安全协作
              </li>
            </ul>
          </div>

          <div class="globe" aria-hidden="true">
            <svg viewBox="0 0 820 470" fill="none">
              <defs>
                <linearGradient id="sphere" x1="205" y1="70" x2="580" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#173b9f" stop-opacity=".9" /><stop offset=".45" stop-color="#10255f" stop-opacity=".83" /><stop offset="1" stop-color="#061126" stop-opacity=".12" /></linearGradient>
                <linearGradient id="route-gradient" x1="87" y1="145" x2="730" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#30c6ff" /><stop offset=".52" stop-color="#3f78ff" /><stop offset="1" stop-color="#9d55ff" /></linearGradient>
                <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.15" fill="#4e7dff" fill-opacity=".36" /></pattern>
                <clipPath id="clip"><circle cx="382" cy="344" r="268" /></clipPath>
              </defs>
              <circle cx="382" cy="344" r="268" fill="url(#sphere)" stroke="#355fee" stroke-opacity=".32" />
              <g clip-path="url(#clip)">
                <ellipse cx="382" cy="344" rx="268" ry="76" stroke="#3d65d9" stroke-opacity=".24" />
                <ellipse cx="382" cy="344" rx="268" ry="154" stroke="#3d65d9" stroke-opacity=".22" />
                <ellipse cx="382" cy="344" rx="268" ry="226" stroke="#3d65d9" stroke-opacity=".17" />
                <ellipse cx="382" cy="344" rx="92" ry="268" stroke="#3d65d9" stroke-opacity=".22" />
                <ellipse cx="382" cy="344" rx="180" ry="268" stroke="#3d65d9" stroke-opacity=".17" />
                <g fill="url(#dots)"><path d="M165 245c18-22 44-38 71-42l29 13 11 22 22 9 10 24-12 14-32-5-21 14-31-4-18-15-27-7-2-23Z" /><path d="M275 285c23 8 39 25 45 50l-7 34 13 36-10 39-23 30-14-22 3-38-17-38-2-39 12-52Z" /><path d="M365 215c28-25 61-41 99-43l29 17 41-2 38 20 25 29-4 24-31 5-24-12-24 7-6 26-26 14-16 35-30 18-19-16 10-33-20-24-9-30-24-15-39 2Z" /><path d="M456 322c20-7 43-3 58 9l4 25-13 25 8 31-22 39-31-4-20-23 4-33-13-25 25-44Z" /></g>
              </g>
              <path d="M91 328C214 114 349 83 477 285" stroke="url(#route-gradient)" stroke-opacity=".9" />
              <path d="M138 403C272 210 429 187 624 369" stroke="url(#route-gradient)" stroke-opacity=".73" />
              <path d="M260 432C358 224 531 191 720 318" stroke="url(#route-gradient)" stroke-opacity=".67" />
              <path class="route" d="M108 312C258 196 392 201 557 352" stroke="url(#route-gradient)" stroke-opacity=".55" />
              <g fill="#d9f1ff"><circle class="node" cx="91" cy="328" r="3.2" /><circle class="node" cx="260" cy="432" r="3.1" /><circle class="node" cx="477" cy="285" r="3.2" /><circle class="node" cx="624" cy="369" r="3.2" /><circle class="node" cx="720" cy="318" r="3.2" /></g>
            </svg>
            <span class="tag tag-a">转写</span><span class="tag tag-b">翻译</span><span class="tag tag-c">字幕</span><span class="tag tag-d">配音</span>
          </div>
        </section>

        <aside class="login-column" aria-label="登录区域">
          <div class="login-frame">
            <section class="login-card">
              <h2>登录平台</h2>
              <p class="login-subtitle">请输入管理员分配的内部账号以继续</p>
              <form id="login-form" novalidate>
                <div class="field">
                  <label for="login-name">账号</label>
                  <div class="input-shell">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" /><path d="M4 21c0-4.1 3.6-7 8-7s8 2.9 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
                    <input id="login-name" name="loginName" type="text" autocomplete="username" placeholder="请输入管理员分配的账号" required />
                  </div>
                </div>
                <div class="field">
                  <label for="password">密码</label>
                  <div class="input-shell">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.8" stroke="currentColor" stroke-width="1.8" /><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" /></svg>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
                    <button class="password-toggle" id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false"><span>显示</span></button>
                  </div>
                </div>
                <div class="options">
                  <label class="remember" for="remember-login-name"><input id="remember-login-name" type="checkbox" /><span>记住账号</span></label>
                  <span class="account-note">内部员工账号</span>
                </div>
                <button class="submit" id="submit-button" type="submit"><span>登录工作台</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
                <output class="form-message" id="form-message" aria-live="polite"></output>
              </form>
            </section>
          </div>
          <p class="security-note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5 20 6.6v5.6c0 4.8-3.25 8.15-8 9.95-4.75-1.8-8-5.15-8-9.95V6.6L12 3.5Z" stroke="currentColor" stroke-width="1.7" /><path d="m9.2 12.3 1.8 1.8 3.9-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg><span>无法登录？请联系公司系统管理员重置密码。</span></p>
        </aside>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
